name: full clone mirror

on:
  workflow_dispatch:
    inputs:
      repository: { description: 'Repo', required: true, default: 'rezadinosaurus/butterflies_xiaomi_sm8250' }
      branch: { description: 'Branch (kosongkan untuk semua branch)', required: false, default: '' }

jobs:
  clone:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Full clone and bundle
      run: |
        export TZ="Antarctica/McMurdo"
        BUILD_TIME=$(date +'%H%M-%d%m%y')
        echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV

        REPO_URL="https://github.com/${{ github.event.inputs.repository }}.git"
        BRANCH="${{ github.event.inputs.branch }}"

        if [ -n "$BRANCH" ]; then
          git clone --branch "$BRANCH" "$REPO_URL" full-repo
        else
          git clone --no-single-branch "$REPO_URL" full-repo
          cd full-repo
          git fetch --all --tags
          cd ..
        fi

        cd full-repo
        git bundle create ../full-repo.bundle --all
        cd ..
        
        SIZE=$(stat -c%s full-repo.bundle)
        LIMIT=$((1900*1024*1024))
        if [ "$SIZE" -gt "$LIMIT" ]; then
          split -b 1900M full-repo.bundle full-repo.bundle.part-
          rm full-repo.bundle
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: clone-${{ env.BUILD_TIME }}
        name: Full Clone Mirror ${{ env.BUILD_TIME }}
        files: |
          full-repo.bundle
          full-repo.bundle.part-*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
