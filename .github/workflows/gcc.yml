name: gcc build

on:
  workflow_dispatch:
    inputs:
      repository: { description: 'Repo', required: true, default: 'rezadinosaurus/butterflies_xiaomi_sm8250' }
      branch: { description: 'Branch', required: true, default: 'lineage-latte' }
      defconfig: { description: 'Defconfig', required: true, default: 'vendor/alioth_defconfig' }
      kernelsu_branch: { description: 'KSU Branch', required: false, default: 'master' }

env:
  KBUILD_BUILD_USER: "amogus"
  KBUILD_BUILD_HOST: "amogus"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ github.event.inputs.repository }}
        ref: ${{ github.event.inputs.branch }}
        submodules: recursive

    - name: Setup and Build
      run: |
        sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc zip gcc-arm-linux-gnueabi python3 python-is-python3 git wget curl device-tree-compiler zstd xz-utils

        export TZ="Antarctica/McMurdo"
        BUILD_TIME=$(date +'%H%M-%d%m%y')
        echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV

        mkdir -p tc/gcc
        wget -q "https://github.com/mvaisakh/gcc-build/releases/download/27092026/eva-gcc-arm64-27092026.xz" -O tc/gcc.tar.xz
        tar -xf tc/gcc.tar.xz -C tc/gcc --strip-components=1
        export PATH=$PWD/tc/gcc/bin:$PATH

        GCC_PREFIX=$(find $PWD/tc/gcc/bin -name '*-gcc' | head -n1 | sed 's/.*\///;s/gcc$//')
        echo "Detected GCC prefix: $GCC_PREFIX"

        curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -s ${{ github.event.inputs.kernelsu_branch }}

        # force k11a hardware id to load the apollo 5k profile
        sed -i 's/"K11A_GY_4520mah"/"j3ssun_5000mah"/g' drivers/power/supply/qcom/qpnp-fg-gen4.c
        sed -i 's/"K11A_FMT_4520mah"/"j3ssun_5000mah"/g' drivers/power/supply/qcom/qpnp-fg-gen4.c

        export ARCH=arm64
        ARGS="O=out ARCH=arm64 CROSS_COMPILE=${GCC_PREFIX} CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- KCFLAGS=-Wno-error"

        make $ARGS ${{ github.event.inputs.defconfig }}
        make -j$(nproc) $ARGS dtbs dtboimage || true
        make $ARGS dtb.img || true
        make -j$(nproc) $ARGS 2>&1 | tee compile.log

        if [ -f out/arch/arm64/boot/Image ]; then
          ZIP_NAME="imell-$BUILD_TIME.zip"

          [ -f out/arch/arm64/boot/dtb.img ] && cp out/arch/arm64/boot/dtb.img ./
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img ./
          cp out/arch/arm64/boot/Image ./

          zip -r "$ZIP_NAME" Image *.dtb *.img
          echo "FINAL_ZIP=$ZIP_NAME" >> $GITHUB_ENV
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v3
      if: env.FINAL_ZIP != ''
      with:
        tag_name: build-gcc-${{ env.BUILD_TIME }}
        name: GCC Kernel Build ${{ env.BUILD_TIME }}
        files: |
          ${{ env.FINAL_ZIP }}
          compile.log
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
