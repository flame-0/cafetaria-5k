name: build DTB/DTBO

on:
  workflow_dispatch:
    inputs:
      repository: { description: 'Repo', required: true, default: 'rezadinosaurus/butterflies_xiaomi_sm8250' }
      branch: { description: 'Branch', required: true, default: 'lineage-latte' }
      defconfig: { description: 'Defconfig', required: true, default: 'vendor/alioth_defconfig' }

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ github.event.inputs.repository }}
        ref: ${{ github.event.inputs.branch }}
        submodules: recursive

    - name: Setup and Build
      run: |
        sudo apt-get update && sudo apt-get install -y build-essential bison flex libssl-dev libelf-dev bc gcc-arm-linux-gnueabi python3 python-is-python3 wget zip

        export TZ="Antarctica/McMurdo"
        BUILD_TIME=$(date +'%H%M-%d%m%y')
        echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV

        mkdir -p tc
        wget -qO- https://github.com/mvaisakh/gcc-build/releases/download/06092026/eva-gcc-arm64-06092026.xz | tar -x -C tc --strip-components=1

        export PATH=$PWD/tc/bin:$PATH
        export ARCH=arm64
        ARGS="O=out ARCH=arm64 CC=aarch64-elf-gcc LD=aarch64-elf-ld.lld AR=aarch64-elf-gcc-ar NM=aarch64-elf-gcc-nm STRIP=aarch64-elf-strip OBJCOPY=aarch64-elf-objcopy OBJDUMP=aarch64-elf-objdump CROSS_COMPILE=aarch64-elf- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

        make $ARGS ${{ github.event.inputs.defconfig }}
        make -j$(nproc) $ARGS dtbs dtbo.img
        make $ARGS dtb.img

        mkdir -p output
        [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img output/
        [ -f out/arch/arm64/boot/dtb.img ] && cp out/arch/arm64/boot/dtb.img output/
        
        cd output
        zip -r "dtb-dtbo-$BUILD_TIME.zip" ./*
        echo "FINAL_ZIP=output/dtb-dtbo-$BUILD_TIME.zip" >> $GITHUB_ENV

    - name: Create Release
      uses: softprops/action-gh-release@v3
      if: env.FINAL_ZIP != ''
      with:
        tag_name: dtb-${{ env.BUILD_TIME }}
        name: DTB/DTBO Build ${{ env.BUILD_TIME }}
        files: ${{ env.FINAL_ZIP }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
